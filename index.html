<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1 class="title" aria-label="TETRIS">
    <span class="t1">T</span><span class="t2">E</span><span class="t3">T</span><span class="t4">R</span><span class="t5">I</span><span class="t6">S</span>
  </h1>

  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> <kbd>Esc</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="pause-menu" class="overlay hidden" role="dialog" aria-label="Menú de pausa">
      <div class="overlay-box">
        <p class="menu-title">PAUSA</p>
        <button id="resume-btn" class="menu-btn">Reanudar</button>
        <button id="pause-restart-btn" class="menu-btn">Reiniciar</button>
        <button id="controls-btn" class="menu-btn" aria-expanded="false">Ver controles</button>
        <ul id="controls-list" class="menu-controls hidden">
          <li><kbd>←</kbd><kbd>→</kbd> mover</li>
          <li><kbd>↑</kbd> o <kbd>X</kbd> girar</li>
          <li><kbd>↓</kbd> bajar</li>
          <li><kbd>Espacio</kbd> caída rápida</li>
          <li><kbd>P</kbd> o <kbd>Esc</kbd> pausa</li>
        </ul>
        <label class="menu-level">Nivel inicial
          <select id="start-level">
            <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
            <option>6</option><option>7</option><option>8</option><option>9</option><option>10</option>
          </select>
        </label>
        <p class="menu-hint">El nivel nuevo se usa en la próxima partida.</p>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
